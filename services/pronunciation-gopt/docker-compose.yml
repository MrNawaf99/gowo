# Internal pronunciation service. It is not meant to be reachable from the internet:
# the port is bound to the host's loopback interface only, and GoWord's server
# calls it via PRONUNCIATION_SERVICE_URL (e.g. http://127.0.0.1:8200 on the same
# host, or http://gopt-pronunciation:8000 from a container on the same network).
services:
  gopt-pronunciation:
    build: .
    image: goword/gopt-pronunciation:1
    container_name: gopt-pronunciation
    restart: unless-stopped
    environment:
      SERVICE_TOKEN: ${PRONUNCIATION_SERVICE_TOKEN:?set PRONUNCIATION_SERVICE_TOKEN in .env}
      MAX_CONCURRENT: ${GOPT_MAX_CONCURRENT:-2}
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8200:8000"
    networks:
      - goword-internal
    read_only: true
    tmpfs:
      - /tmp:size=256m   # per-request work dirs; recordings never touch persistent storage
    deploy:
      resources:
        limits:
          memory: 2g

networks:
  goword-internal:
    name: goword-internal
