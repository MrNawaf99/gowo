<!DOCTYPE html>
<html>
<body>
  <script>
    async function test() {
      try {
        console.log("Fetching token from Next.js server...");
        const res = await fetch("/api/ai/deepgram-token");
        const data = await res.json();
        console.log("Token length:", data.token?.length);
        
        console.log("Connecting WebSocket...");
        const ws = new WebSocket("wss://api.deepgram.com/v1/listen?model=nova-2&smart_format=true", [
          "token",
          data.token
        ]);
        
        ws.onopen = () => console.log("WebSocket opened!");
        ws.onerror = (e) => console.log("WebSocket error");
        ws.onclose = (e) => console.log("WebSocket closed", e.code, e.reason);
      } catch (err) {
        console.error(err);
      }
    }
    test();
  </script>
</body>
</html>
